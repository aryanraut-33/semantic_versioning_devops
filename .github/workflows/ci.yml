name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and verify container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run application tests
        run: python -m pytest -q

      - name: Build Docker image
        id: image
        run: |
          source_commit="$(git rev-parse HEAD)"
          docker build \
            --build-arg APP_COMMIT="$source_commit" \
            --tag release-governance-api:ci .
          image_id="$(docker image inspect release-governance-api:ci --format '{{.Id}}')"
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "Built image $image_id from commit $source_commit"

      - name: Start temporary container
        env:
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: |
          docker run --detach \
            --name calculator-ci \
            --publish 127.0.0.1:5003:8000 \
            "$IMAGE_ID"

      - name: Verify running calculator
        env:
          EXPECTED_COMMIT: ${{ steps.image.outputs.commit }}
        run: |
          python scripts/smoke_test.py \
            --base-url http://127.0.0.1:5003 \
            --expected-version "$(cat VERSION)" \
            --expected-commit "$EXPECTED_COMMIT"

      - name: Show container logs
        if: ${{ always() }}
        run: |
          if docker container inspect calculator-ci > /dev/null 2>&1; then
            docker logs calculator-ci
          fi

      - name: Remove temporary container
        if: ${{ always() }}
        run: |
          if docker container inspect calculator-ci > /dev/null 2>&1; then
            docker rm --force calculator-ci
          fi
