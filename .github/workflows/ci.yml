name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and verify container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run application tests
        run: python -m pytest -q

      - name: Build both images
        run: |
          echo "APP_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          APP_COMMIT="$(git rev-parse HEAD)" docker compose --project-name calfit-ci build

      - name: Start temporary frontend and backend
        run: APP_PORT=5003 docker compose --project-name calfit-ci up --detach --no-build --wait --wait-timeout 90

      - name: Verify running application through frontend
        run: |
          python scripts/smoke_test.py \
            --base-url http://127.0.0.1:5003 \
            --expected-version "$(cat VERSION)" \
            --expected-commit "$APP_COMMIT"

      - name: Show container logs
        if: always()
        run: docker compose --project-name calfit-ci logs --no-color --tail 100

      - name: Remove temporary stack
        if: always()
        run: docker compose --project-name calfit-ci down --remove-orphans
