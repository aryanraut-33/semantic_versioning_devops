name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  # workflow_run's github.sha can be newer than the commit that passed CI.
  RELEASE_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    name: Authorize and validate release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.path == '.github/workflows/ci.yml' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require main branch for manual releases
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release validation must be started from main."
            exit 1
          fi

      - name: Check out selected commit and all release tags
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Authorize operator and validate release metadata
        id: release
        env:
          RELEASE_OPERATOR: ${{ vars.RELEASE_OPERATOR }}
        run: |
          python scripts/validate_release.py --github
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Repeat tests for selected release commit
        id: tests
        run: python -m pytest -q

      - name: Record validation outcome
        run: |
          {
            echo "### Release validation passed"
            echo "Commit: $RELEASE_COMMIT"
            echo "Trigger: $GITHUB_EVENT_NAME"
            echo "Operator: $GITHUB_ACTOR"
            echo "Rerun operator: $GITHUB_TRIGGERING_ACTOR"
            echo "Version policy and tests passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save validation decision
        if: always()
        env:
          VALIDATION_RESULT: ${{ steps.release.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = {key: os.environ.get(key) for key in ('RELEASE_COMMIT', 'GITHUB_ACTOR', 'GITHUB_TRIGGERING_ACTOR', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'VALIDATION_RESULT', 'TEST_RESULT')}
          Path(os.environ['RUNNER_TEMP'], 'release-validation.json').write_text(json.dumps(record, indent=2))
          PY

      - name: Upload validation decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-validation.json
          retention-days: 14

  deploy:
    name: Build, test, deploy and verify
    needs: validate
    runs-on: [self-hosted, macOS, ARM64, release-demo]
    env:
      DOCKER_CONTEXT: desktop-linux
      RELEASE_K6_PROFILE: ${{ vars.RELEASE_K6_PROFILE || 'smoke' }}
      MID_VUS: ${{ vars.RELEASE_MID_VUS || '50' }}
      MAX_VUS: ${{ vars.RELEASE_MAX_VUS || '100' }}
      HOLD_SECONDS: ${{ vars.RELEASE_HOLD_SECONDS || '180' }}
      COOLDOWN_SECONDS: '300'
      THINK_SECONDS: ${{ vars.RELEASE_THINK_SECONDS || '0.1' }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.deploy.outputs.version }}
      commit: ${{ steps.deploy.outputs.commit }}
      frontend_image: ${{ steps.deploy.outputs.frontend_image }}
      backend_image: ${{ steps.deploy.outputs.backend_image }}
      attempt: ${{ steps.deploy.outputs.attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the same selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Use installed Python on the Mac
        env:
          MAC_PYTHON: ${{ vars.MAC_PYTHON || 'python3' }}
        run: |
          "$MAC_PYTHON" -c 'import sys; print(sys.executable); print(sys.version); sys.exit(0 if sys.version_info >= (3, 12) else "Python 3.12 or newer is required; configure MAC_PYTHON.")'
          "$MAC_PYTHON" -m venv "$RUNNER_TEMP/release-venv"
          echo "$RUNNER_TEMP/release-venv/bin" >> "$GITHUB_PATH"

      - name: Make local tools available
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/Applications/Docker.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Check local deployment tools
        run: |
          docker info
          kubectl version --client
          minikube version
          k6 version

      - name: Revalidate release on the Mac
        env:
          RELEASE_OPERATOR: ${{ vars.RELEASE_OPERATOR }}
        run: python scripts/validate_release.py --github

      - name: Repeat tests on the Mac
        run: |
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install -r requirements-dev.txt
          "$RUNNER_TEMP/release-venv/bin/python" -m pytest -q

      - name: Build and verify candidate, then deploy to Kubernetes
        id: deploy
        env:
          RELEASE_OPERATOR: ${{ vars.RELEASE_OPERATOR }}
        run: python scripts/deploy_kubernetes.py

      - name: Upload Kubernetes release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/release/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Record verified release
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified Kubernetes evidence
        uses: actions/download-artifact@v4
        with:
          name: kubernetes-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence

      - name: Create tag and GitHub release after deployment verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.deploy.outputs.version }}
          RELEASE_COMMIT: ${{ needs.deploy.outputs.commit }}
          FRONTEND_IMAGE: ${{ needs.deploy.outputs.frontend_image }}
          BACKEND_IMAGE: ${{ needs.deploy.outputs.backend_image }}
          DEPLOY_ATTEMPT: ${{ needs.deploy.outputs.attempt }}
          RELEASE_OPERATOR: ${{ vars.RELEASE_OPERATOR }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          if [[ -z "$RELEASE_OPERATOR" || "${GITHUB_ACTOR,,}" != "${RELEASE_OPERATOR,,}" || "${GITHUB_TRIGGERING_ACTOR,,}" != "${RELEASE_OPERATOR,,}" ]]; then
            echo "Release publication requires the authorized operator."
            exit 1
          fi
          if [[ "$DEPLOY_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo "Deployment evidence is from an earlier attempt. Inspect deployment and tag state before recovery; see Phase 7 in LOAD_BALANCING.md."
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['RUNNER_TEMP'], 'release-evidence', 'release-report.json').read_text())
          assert report['status'] == 'verified', 'Deployment was not verified'
          assert report['commit'] == os.environ['RELEASE_COMMIT'], 'Commit evidence mismatch'
          assert report['version'] == os.environ['RELEASE_VERSION'], 'Version evidence mismatch'
          assert report['run_id'] == os.environ['GITHUB_RUN_ID'], 'Workflow evidence mismatch'
          assert report['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT'], 'Attempt evidence mismatch'
          for role in ('frontend', 'backend'):
              assert report['images'][role]['tag'] == os.environ[role.upper() + '_IMAGE'], 'Image evidence mismatch'
          PY
          tag="v$RELEASE_VERSION"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > "$RUNNER_TEMP/existing-tag.json" 2> "$RUNNER_TEMP/tag-error.txt"; then
            actual_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["object"]["sha"])' "$RUNNER_TEMP/existing-tag.json")"
            if [[ "$actual_commit" != "$RELEASE_COMMIT" ]]; then
              echo "Existing tag does not point directly to the verified commit. Inspect before retrying."
              exit 1
            fi
          else
            if ! grep -q 'HTTP 404' "$RUNNER_TEMP/tag-error.txt"; then
              cat "$RUNNER_TEMP/tag-error.txt"
              exit 1
            fi
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$RELEASE_COMMIT"
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          body = (
              f"Verified deployment of {os.environ['RELEASE_VERSION']}.\n\n"
              f"Commit: {os.environ['RELEASE_COMMIT']}\n\n"
              f"Frontend image tag: {os.environ['FRONTEND_IMAGE']}\n\n"
              f"Backend image tag: {os.environ['BACKEND_IMAGE']}\n\n"
              f"Workflow: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}\n"
          )
          if os.environ.get('CI_RUN_URL'):
              body += f"\nCI: {os.environ['CI_RUN_URL']}\n"
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(body)
          PY
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release already exists at the verified tag."
          else
            gh release create "$tag" --verify-tag --title "$tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$tag" \
            "$RUNNER_TEMP/release-evidence/release-report.json" \
            "$RUNNER_TEMP/release-evidence/k6-candidate.json" \
            "$RUNNER_TEMP/release-evidence/k6-live.json" --clobber
          echo "Verified release: $tag ($RELEASE_COMMIT)" >> "$GITHUB_STEP_SUMMARY"
