services:
  backend:
    image: ${BACKEND_IMAGE:-calfit-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)" ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
  frontend:
    image: ${FRONTEND_IMAGE:-calfit-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    ports:
      - "127.0.0.1:${APP_PORT:-5006}:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/frontend-version.json" ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
