server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    location /api/ { proxy_pass $backend$request_uri; }
    location = /health { proxy_pass $backend$request_uri; }
    location = /version { proxy_pass $backend$request_uri; }
    location = /frontend-version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location /assets/ { try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ ^/(calories-bmi|bmi)(/results)?$ { try_files /index.html =404; }
    location = /behind-the-numbers { try_files /index.html =404; }
    location = / { try_files /index.html =404; }
    location / { return 404; }
}
