server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the stable Kubernetes Service at Nginx startup.
    # Individual backend pod IPs are managed by the Service.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A fresh upstream connection gives the Service a new selection opportunity.
    # This keeps the small local distribution demo observable.
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    location /api/ { proxy_pass http://calfit-backend:8000; }
    location = /health { proxy_pass http://calfit-backend:8000; }
    location = /version { proxy_pass http://calfit-backend:8000; }

    location = /frontend-version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location /assets/ { try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ ^/(calories-bmi|bmi)(/results)?$ { try_files /index.html =404; }
    location = /behind-the-numbers { try_files /index.html =404; }
    location = / { try_files /index.html =404; }
    location / { return 404; }
}
