apiVersion: v1
kind: Service
metadata:
  name: calfit-backend
  namespace: calfit
spec:
  type: ClusterIP
  sessionAffinity: None
  internalTrafficPolicy: Cluster
  selector:
    app: calfit-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: calfit-frontend
  namespace: calfit
spec:
  type: ClusterIP
  selector:
    app: calfit-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
