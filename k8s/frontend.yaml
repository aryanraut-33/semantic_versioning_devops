apiVersion: apps/v1
kind: Deployment
metadata:
  name: calfit-frontend
  namespace: calfit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calfit-frontend
  template:
    metadata:
      labels:
        app: calfit-frontend
    spec:
      containers:
        - name: frontend
          image: calfit-frontend:k8s-phase3
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          startupProbe:
            httpGet:
              path: /frontend-version.json
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /frontend-version.json
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /frontend-version.json
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: nginx-config
          configMap:
            name: calfit-nginx
