apiVersion: apps/v1
kind: Deployment
metadata:
  name: calfit-backend
  namespace: calfit
spec:
  # HPA owns the replica count; its minReplicas keeps at least two backends.
  selector:
    matchLabels:
      app: calfit-backend
  template:
    metadata:
      labels:
        app: calfit-backend
    spec:
      containers:
        - name: backend
          image: calfit-backend:k8s-phase3
          imagePullPolicy: Never
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
